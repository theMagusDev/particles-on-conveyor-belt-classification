[project]
name = "cv-lab1"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.3",
    "pillow==13.0.0",
    "six>=1.17.0",
    "torch==2.11.0",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29,<8",
    "matplotlib==3.10.0",
    "nbconvert>=7.16,<8",
    "torchvision==0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
